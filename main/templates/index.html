<!DOCTYPE html>
<html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .piece {
            transition: transform 0.2s ease;
        }
        .piece:hover {
            transform: scale(1.1);
        }
        .piece.dragging {
            opacity: 0.5;
            cursor: grabbing !important;
        }
        .piece {
            cursor: grab;
        }
    </style>
</head>
<body class="m-0 p-0 overflow-hidden">
  <div class="relative w-screen h-screen">
      <!-- Background Image -->
      <img src="/static/img/background.jpg" alt="Background" class="absolute inset-0 w-full h-full object-cover">
      
      <!-- Chess Board Container -->
      <div class="absolute inset-0 flex items-center justify-center">
          <!-- Board Image with pieces overlay -->
          <div class="relative">
              <img src="/static/img/board.png" alt="Chess Board" class="w-[800px] h-[800px]">
              
              <!-- Chess pieces positioned absolutely over the board -->
              <div class="absolute inset-0 grid grid-cols-8 grid-rows-8">
                  <!-- Row 1 (Black pieces) -->
                  <div class="flex items-center justify-center" data-square="a8">
