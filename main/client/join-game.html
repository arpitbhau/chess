<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js GLB Viewer</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>

    <div class="main relative overflow-hidden bg-black">
        <canvas class="absolute chess-board-bg w-screen h-screen block"></canvas>
        
        <div class="content w-full h-screen relative flex flex-col justify-center items-center">
            <h1 class="text-4xl mb-8 text-white">Join Game</h1>
            <input type="text" placeholder="Enter room code" class="px-4 py-2 mb-6 bg-gray-800 text-white border border-gray-600 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500 transition">
            <div class="relative flex gap-4 items-center justify-center">
                <button id="join-game-btn" class="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">Join Game</button>
                <a href="create-game.html" class="text-[#007bff] underline">wanna create one?</a>
            </div>
        </div>
    </div>





    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="./assets/js/model-animate.js"></script>
    <script src="./assets/js/join-game.js"></script>
</body>
</html>
